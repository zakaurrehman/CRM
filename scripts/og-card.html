<!doctype html>
<!--
  The share card: what WhatsApp, LinkedIn and the rest show when the site's
  link is pasted. The homepage opening, composed for 1200×630: the hot slab
  under the shade, the mark in its pool of light, the headline and the
  sentence. Rendered to public/images/og/site.jpg by scripts/og-card.mjs;
  edit here, then run that.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b1226; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: url("../public/images/hero/hot-metal-plate.jpg") center 45%/cover; }
  .card::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.42) 0%, rgba(0,0,0,.5) 70%, rgba(0,0,0,.7) 100%); }
  .light { position: absolute; left: 50%; top: 150px; width: 640px; height: 200px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,.92) 0%, rgba(255,255,255,.55) 32%, rgba(255,255,255,0) 68%); }
  .in { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 88px; }
  .logo { width: 250px; height: auto; }
  h1 { margin: 44px 0 0; font: 500 66px/1.06 Archivo, Inter, sans-serif; letter-spacing: -.024em; color: #fff; max-width: 720px; }
  .rule { width: 72px; height: 1px; background: rgba(255,255,255,.4); margin: 28px 0 22px; }
  p { margin: 0; font: 400 24px/1.45 Inter, sans-serif; color: rgba(255,255,255,.85); max-width: 820px; }
</style>
</head>
<body>
  <div class="card">
    <span class="light"></span>
    <div class="in">
      <img class="logo" src="../public/images/branding/ims-logo.png" alt="">
      <h1>Turning Complex<br>Scrap into Opportunity</h1>
      <span class="rule"></span>
      <p>IMS specialises in complex high-nickel, superalloy, titanium and refractory materials.</p>
    </div>
  </div>
</body>
</html>
